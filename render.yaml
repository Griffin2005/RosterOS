# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# One Docker web service built from the root Dockerfile, plus a managed
# PostgreSQL 16 database. Data persists across deploys and restarts. On the
# first start against an empty database the app seeds the sample data and
# publishes December; later starts only add missing columns (forward-only
# migration) and any missing demo accounts.
#
# Secrets are never in this file. Render asks for the `sync: false` values
# when the Blueprint is applied; they must meet the password policy
# (12+ characters, upper and lower case, a number, a symbol, not containing
# the username). Without DEMO_PASSWORD the other demo accounts stay disabled
# until the admin issues them one-time passwords from Team. Passwords are
# applied to accounts that do not have one yet; after that, change them in
# the app (Account, or Team for other people).
databases:
  - name: rosteros-db
    plan: free                     # free Render Postgres expires 30 days after creation unless upgraded
    region: oregon
    postgresMajorVersion: "16"
    databaseName: rosteros
    user: rosteros
    ipAllowList: []                # no access from the internet: only services in this account connect

services:
  - type: web
    name: rosteros
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon                 # same region as the database, so it uses the private network
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production          # secure cookies, HSTS, no public API docs, strict start-up checks
      - key: DATABASE_URL
        fromDatabase:
          name: rosteros-db
          property: connectionString   # internal address; the app selects the psycopg driver itself
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD        # required: password for the `admin` account
        sync: false
      - key: DEMO_PASSWORD         # optional: shared password for ops, leads, brand owner, employees, auditor
        sync: false
      # The free plan is 0.1 vCPU: one search thread, and enough wall time for
      # the coverage phase to finish its proof (measured: proven in well under
      # a minute; the quality phase then stops once it stops improving).
      - key: SOLVER_WORKERS
        value: "1"
      - key: SOLVER_TIME_LIMIT_S
        value: "60"
      - key: ANTHROPIC_API_KEY     # optional; without it the assistant answers from the validator
        sync: false
